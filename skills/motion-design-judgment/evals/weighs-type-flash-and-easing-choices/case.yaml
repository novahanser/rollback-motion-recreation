schema_version: "1.1"
name: weighs-type-flash-and-easing-choices
expected_outcome: |
  回答逐条给出判断，并区分观察、解读和无法确认的事。
  第 1 条：指出细字要靠周围的空和足够的停留时间才当得了第一位；在叠了二三十个小标签、只停半秒的画面里，细的片名会变成线条的一部分。给出方向（加粗、清空周围、减少标签、或把片名的工作改成底纹并另写一份要读的），并说明各自的代价。
  第 2 条：不从画面上指认字体的名称，说明成片里的字经过缩放、压缩和处理，认不准；建议去查署名或发布说明，或者按粗细、宽窄、有无衬线这些外形去找相近的字。
  第 3 条：算出 150 bpm、30 fps 下一拍是 12 帧、0.4 秒，即每秒 2.5 次整屏闪，持续 8 小节约 12.8 秒；提醒大面积高反差闪烁的光敏风险，给出至少一种降低风险的办法（减小面积、降低反差、缩短成一小串、只在小节的某处用）；说明先定这一帧是强调、转场还是预告，并指出参考作品里一帧的闪多数不落在每一拍上。
  第 4 条：不把回弹说成参考片的通例；说明量过的十几处里没有量到回弹，量到的是一帧到位、分步跳、先快后慢地停住、匀速等几种形状；不把量到的位置序列说成作者的关键帧参数；如果给出数值，标明是自己的建议并说明怎样在渲染出的草稿上核对。
  每条建议带依据（作品编号和时间）、适用条件或代价。
