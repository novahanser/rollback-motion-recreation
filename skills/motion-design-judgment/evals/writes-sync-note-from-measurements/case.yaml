schema_version: "1.1"
name: writes-sync-note-from-measurements
expected_outcome: |
  笔记把量到的东西写成观察：切点锁在两拍上而不是每一拍；落在重音上的是画面内事件而不是切点；运动量跟着高频能量而不是总响度；段落交界多数对应大的画面变化。它指出「每 3 帧换一次」来自每 3 帧取一帧的条带，这种取样本身会造出 3 帧的节奏，不能据此确定步长，需要逐帧核对；把 posterizeTime 列为推测或待验证，不写成事实。笔记分开写观察、推测和待验证，并说明测量的局限（重音是估计的、检测到的切点可能包含只换底色的帧）。
