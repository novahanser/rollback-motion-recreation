schema_version: "1.1"
name: reads-still-without-inferring-motion
expected_outcome: |
  回答先说明：只凭一张静帧，无法知道原片里各元素的入场顺序、各停几帧、前后有没有闪、相机在做什么，也不能确认这张图就是成片里的一帧；它不把任何帧数或顺序说成原片的事实。它或者请用户提供成片以便对上帧、逐帧看前后，或者明确标出「下面是按你的内容给出的方案，不是原片的还原」，再给出进场、停留、退场的安排和理由（例如要读的字给更长的时间，很满的整版可以只停几帧，退场可以借用切点或替换）。关于棋盘格，它既不断言「作者忘了关透明底」，也不断言一定是有意放的；说明判断要看它的边界是什么形状、跟着谁走、出现在什么时刻，而后两项静帧说明不了。它给出用户自己要不要放棋盘格的条件或代价（片子里有没有「拿掉一样东西」要表达；细密高反差图案的闪烁和压缩问题），并提醒不要把这张图的一组元素原样搬过来，而是从自己的曲子里找东西承担同样的工作。
